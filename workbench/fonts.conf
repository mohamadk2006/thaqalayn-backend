<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Arabic Word fonts that can't be installed here (Microsoft/Iranian, not
     redistributable), mapped to the closest free faces so rendered original pages look
     and break lines like the books do. Installed as /etc/fonts/local.conf. -->
<fontconfig>
  <alias binding="same"><family>Traditional Arabic</family><prefer><family>Amiri</family></prefer></alias>
  <alias binding="same"><family>Arabic Typesetting</family><prefer><family>Amiri</family></prefer></alias>
  <alias binding="same"><family>Lotus Linotype</family><prefer><family>Amiri</family></prefer></alias>
  <alias binding="same"><family>Lotus</family><prefer><family>Amiri</family></prefer></alias>
  <alias binding="same"><family>AL-Mohanad</family><prefer><family>Amiri</family></prefer></alias>
  <alias binding="same"><family>Simplified Arabic</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Badr</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>B Badr</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Mitra</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>B Mitra</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>B Nazanin</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>B Lotus</family><prefer><family>Amiri</family></prefer></alias>
  <alias binding="same"><family>B Zar</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Andalus</family><prefer><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>DejaVu Sans</family><family>Noto Naskh Arabic</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Noto Serif</family><family>Amiri</family></prefer></alias>
</fontconfig>
