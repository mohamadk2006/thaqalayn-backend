[project]
name = "thaqalayn-backend"
version = "0.1.0"
description = "Self-hosted catalog, download, and Arabic full-text search API for the Thaqalayn library"
# Pinned below 3.14: asyncpg has no wheels for it yet, and building from source on a
# fresh machine is a bad first-run experience. Revisit once asyncpg ships 3.14 wheels.
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # Only needed for the /admin control panel's file-upload and HTML form parsing.
    "python-multipart>=0.0.9",
    # Reads .docx uploads for the /admin panel's Word-document import path.
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends()/Query() in argument defaults is how FastAPI is designed to be used.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions import op/sa by convention, used or not, and autogenerated column
# definitions are long by nature — rewrapping generated code adds risk, not clarity.
"database/migrations/versions/*" = ["F401", "E501"]
